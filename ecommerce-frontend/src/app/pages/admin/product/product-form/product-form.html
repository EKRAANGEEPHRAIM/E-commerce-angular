<div class="card h-100 shadow-sm">

  <div class="card-header bg-primary text-white">

    <div class="row align-items-center">

      <div class="col-8">

        <h5 class="mb-0">
          {{ product.productId === 0 ? 'New Product' : 'Edit Product' }}
        </h5>

      </div>

      <div class="col-4 text-end">

        <button
          type="button"
          class="btn btn-sm btn-light"
          (click)="onClose()"
        >
          Close
        </button>

      </div>

    </div>

  </div>

  <div class="card-body">

    <form
      #productForm="ngForm"
      (ngSubmit)="productForm.form.valid && onSave()"
    >

      <div class="row g-2">

        <!-- SKU -->
        <div class="col-md-6">

          <label class="form-label small fw-bold">
            Product SKU
          </label>

          <input
            type="text"
            class="form-control form-control-sm"
            name="productSku"
            [(ngModel)]="product.productSku"
            required
          >

        </div>


        <!-- Name -->
        <div class="col-md-6">

          <label class="form-label small fw-bold">
            Name
          </label>

          <input
            type="text"
            class="form-control form-control-sm"
            name="productName"
            [(ngModel)]="product.productName"
            required
          >

        </div>


        <!-- Category -->
        <div class="col-12">

          <label class="form-label small fw-bold">
            Category
          </label>

          <select
            class="form-select form-select-sm"
            name="categoryId"
            [(ngModel)]="product.categoryId"
            required
          >

            <option
              [ngValue]="0"
              disabled
            >
              Select a category
            </option>

            @for (category of categories; track category.categoryId) {

              <option [ngValue]="category.categoryId">
                {{ category.categoryName }}
              </option>

            }

          </select>

        </div>


        <!-- Short Name -->
        <div class="col-12">

          <label class="form-label small fw-bold">
            Short Name
          </label>

          <input
            type="text"
            class="form-control form-control-sm"
            name="productShortName"
            [(ngModel)]="product.productShortName"
          >

        </div>


        <!-- Price -->
        <div class="col-md-6">

          <label class="form-label small fw-bold">
            Price ($)
          </label>

          <input
            type="number"
            class="form-control form-control-sm"
            name="productPrice"
            [(ngModel)]="product.productPrice"
            min="0"
          >

        </div>


        <!-- Delivery -->
        <div class="col-md-6">

          <label class="form-label small fw-bold">
            Delivery Time
          </label>

          <input
            type="text"
            class="form-control form-control-sm"
            name="deliveryTimeSpan"
            [(ngModel)]="product.deliveryTimeSpan"
            placeholder="e.g. 3-5 days"
          >

        </div>


        <!-- Image -->
        <div class="col-12">

          <label class="form-label small fw-bold">
            Image URL
          </label>

          <input
            type="url"
            class="form-control form-control-sm"
            name="productImageUrl"
            [(ngModel)]="product.productImageUrl"
          >

        </div>


        <!-- Description -->
        <div class="col-12">

          <label class="form-label small fw-bold">
            Description
          </label>

          <textarea
            class="form-control form-control-sm"
            name="productDescription"
            [(ngModel)]="product.productDescription"
            rows="3"
          ></textarea>

        </div>


        <!-- Buttons -->
        <div class="col-12 mt-3 d-flex gap-2 justify-content-end">

          <button
            type="button"
            class="btn btn-sm btn-secondary"
            (click)="onReset()"
          >
            Reset
          </button>

          <button
            type="submit"
            class="btn btn-sm btn-success"
            [disabled]="productForm.invalid"
          >
            Save Product
          </button>

        </div>

      </div>

    </form>

  </div>

</div>
